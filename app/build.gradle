plugins { id 'com.android.application' }

android {
    namespace 'com.arao.pomodoro'
    compileSdk 36

    defaultConfig {
        applicationId 'com.arao.pomodoro.work'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '0.8.0-work'
    }

    signingConfigs {
        debug {
            def personalKey = rootProject.file('development/debug.keystore')
            if (personalKey.exists()) storeFile personalKey
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError true }
}
