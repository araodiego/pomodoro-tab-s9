plugins { id 'com.android.application' }

android {
    namespace 'com.arao.pomodoro'
    compileSdk 36

    defaultConfig {
        applicationId 'com.arao.pomodoro'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('development/debug.keystore')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError true }
}
